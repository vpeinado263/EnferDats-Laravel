services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enferdats_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - enferdats
  mysql:
    image: mysql:8.0
    container_name: enferdats_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: enferdats_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enferdats
  nginx:
    image: nginx:alpine
    container_name: enferdats_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - enferdats
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: enferdats_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - mysql
    networks:
      - enferdats
volumes:

  mysql_data:

networks:

  enferdats:
